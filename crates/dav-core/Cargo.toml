[package]
name = "bifrost-dav-core"
description = "Private shared WebDAV layer for the bifrost CalDAV and CardDAV clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types" }
bytes = { workspace = true }
futures = { workspace = true }
quick-xml = "0.42.0"
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true, features = ["native-tls"] }

[features]
# Scripted DAV wire seam for the CalDAV and CardDAV test suites.
test-support = ["bifrost-net/test-support"]

[dev-dependencies]
# The crate's own tests script the wire seam through `test_support`, which is
# feature-gated for consumers and `cfg(test)`-enabled here; the seam it fronts
# lives behind `bifrost-net/test-support`.
bifrost-net = { path = "../net", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
