[package]
name = "bifrost-google"
publish = false
description = "Google Account implementation for bifrost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["email", "gmail", "google", "contacts", "mail"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types" }
bytes = { workspace = true }
jiff = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "native-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bifrost-net = { path = "../net", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
