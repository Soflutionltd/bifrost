[package]
name = "bifrost-graph"
description = "Microsoft Graph Account implementation for bifrost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["email", "graph", "microsoft", "exchange"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types" }
bytes = { workspace = true }
jiff = { workspace = true }
email_address = { version = "0.2.1", default-features = false }
futures = { workspace = true }
getrandom = { workspace = true }
quick-xml = "0.42.0"
reqwest = { workspace = true, features = ["json", "native-tls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The scripted wire dispatch the REST and aux seams answer from, so a
# scripted status travels the production retry loop instead of this
# crate restating what bifrost-net does with one.
bifrost-net = { path = "../net", features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
