[package]
name = "bifrost-carddav"
publish = false
description = "CardDAV Account implementation for bifrost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["contacts", "carddav", "vcard", "webdav"]
categories = ["email", "network-programming", "asynchronous"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
bifrost-dav-core = { path = "../dav-core" }
bifrost-net = { path = "../net" }
bifrost-types = { path = "../types" }
bytes = { workspace = true }
caldata = { workspace = true }
futures = { workspace = true }
quick-xml = "0.42.0"
reqwest = { workspace = true, features = ["native-tls"] }
uuid = { workspace = true }

[dev-dependencies]
bifrost-dav-core = { path = "../dav-core", features = ["test-support"] }
bifrost-net = { path = "../net", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
